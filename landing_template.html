<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1838">
<title>The Royale Report</title>
<link rel="icon" href="web/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Landing page: same arena-blue look as the dashboards (colors copied from dashboard_template.html). */
:root {
  --night: #0a1838; --panel: #14306c; --panel-hi: #1c4190; --edge: #3d6dd0; --edge-dark: #0a1a44;
  --ink: #eef4ff; --muted: #a3b6df; --gold: #ffd23f; --gold-deep: #b97c00;
  --blue: #49b2ff; --blue-deep: #1663c7; --red: #ff5269; --red-deep: #b5192f;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%, #2a5bc0 0%, transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 22px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 22px),
    var(--night);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding: max(40px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 22px;
}
.outline { text-shadow: 0 2px 0 var(--edge-dark), 0 -1px 0 var(--edge-dark), 1px 0 0 var(--edge-dark), -1px 0 0 var(--edge-dark), 0 3px 4px rgba(0,0,0,.4); }
header { text-align: center; display: grid; gap: 6px; justify-items: center; }
.crown { width: 64px; height: 64px; }
h1 { font-family: var(--font-display); font-weight: 400; letter-spacing: .5px; margin: 0; font-size: clamp(34px, 8vw, 52px); color: var(--gold); line-height: 1.05; }
.tag { color: var(--muted); font-weight: 700; margin: 0; }
.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
a.player {
  display: grid; gap: 14px; text-decoration: none; color: var(--ink);
  background: linear-gradient(180deg, var(--panel-hi), var(--panel));
  border: 3px solid var(--edge); border-bottom-width: 6px; border-bottom-color: var(--edge-dark);
  border-radius: 18px; padding: 18px 20px;
}
a.player:hover { border-color: var(--gold); border-bottom-color: var(--gold-deep); }
a.player:active { transform: translateY(2px); }
.top { display: flex; align-items: center; gap: 14px; }
.shield {
  width: 56px; height: 64px; flex: none; display: grid; place-items: center;
  background: linear-gradient(180deg, var(--blue), var(--blue-deep));
  clip-path: polygon(50% 0, 100% 14%, 100% 62%, 50% 100%, 0 62%, 0 14%);
  font-family: var(--font-display); font-size: 28px;
}
.name { font-family: var(--font-display); font-size: 30px; line-height: 1.05; color: var(--gold); }
.sub { color: var(--muted); font-weight: 700; font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: rgba(5, 15, 45, .45); border-radius: 12px; padding: 8px 10px; display: grid; }
.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; }
.stat .v { font-family: var(--font-display); font-size: 21px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.win { color: var(--blue); } .gold { color: var(--gold); }
.open {
  font-family: var(--font-display); font-size: 18px; letter-spacing: .5px; text-align: center;
  color: #3a2200; padding: 10px; border-radius: 12px;
  background: linear-gradient(180deg, var(--gold), #f0a800);
  border: 2px solid var(--gold-deep); box-shadow: 0 3px 0 var(--gold-deep);
}
.updated { text-align: center; color: var(--muted); font-weight: 700; margin: 0; }
.rr-foot { text-align: center; color: var(--muted); font-size: 12px; border-top: 1px solid rgba(163, 182, 223, .25); padding-top: 12px; }
.rr-foot p { margin: 6px 0; }
.rr-foot a { color: var(--muted); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <svg class="crown" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 22l12 10 12-20 12 20 12-10-6 30H14z" fill="#ffd23f" stroke="#b97c00" stroke-width="4" stroke-linejoin="round"/><rect x="14" y="50" width="36" height="6" rx="2" fill="#b97c00"/></svg>
    <h1 class="outline">The Royale Report</h1>
    <p class="tag">Clash Royale battle stats. Pick a player.</p>
  </header>
  <nav class="players" aria-label="Players">
    <!--__PLAYERS__-->
  </nav>
  <p class="updated">Updated <span id="updated" data-t="__GENERATED__">__GENERATED__</span>. Open a page and tap Refresh for the newest battles.</p>
  <!--__FOOTER__-->
</main>
<script>
  // "Updated 3 hr ago" from the last battle refresh.
  (function () {
    const el = document.getElementById("updated");
    const s = Math.max(0, (Date.now() - Date.parse(el.dataset.t)) / 1000);
    el.textContent = s < 90 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago"
      : s < 172800 ? Math.round(s / 3600) + " hr ago" : Math.round(s / 86400) + " days ago";
  })();
</script>
</body>
</html>
