# Pulls new battles for everyone in config.json, saves them to the battle-data branch, rebuilds the pages
# and publishes them to GitHub Pages.
# Runs when someone taps Refresh, every day at 3 AM Eastern (started by the Cloudflare Worker, with
# GitHub's own schedule below as a backup), on pushes to main, and by hand from the Actions tab
# ("Run workflow"). Builds run on any branch so a feature branch
# can be checked; only main saves battles and deploys.
# Pushes to battle-data don't start this workflow (only main does), so saving never loops.
name: Refresh battles and deploy

on:
  workflow_dispatch:
  schedule:
    # Backup for the daily build. The Worker starts it at 3 AM Eastern on its own Cron Triggers
    # (see worker/worker.js), because GitHub's schedules are best effort: they can start hours late
    # or not at all (on Oct 29, 2026 neither of the old 07:00/08:00 ones ran). These are at 3:30 AM
    # Eastern, off the busy top of the hour. GitHub schedules are in UTC, so there are two: 07:30 UTC
    # is 3:30 AM in summer (EDT) and 08:30 UTC in winter (EST). The "when" job skips whichever one
    # isn't 3:30 AM that day, and skips if the Worker's build already ran.
    - cron: "30 7 * * *"
    - cron: "30 8 * * *"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Only for the backup schedule: go ahead if the schedule that fired is 3:30 AM Eastern today
  # and no build on main has succeeded in the last 3 hours (the Worker's 3 AM one, or a Refresh).
  # It checks the schedule rather than the clock, since a late start shouldn't skip the day.
  # If GitHub can't be asked about earlier builds, it builds anyway.
  when:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=America/New_York date +%Z)" = EDT ]; then three="30 7 * * *"; else three="30 8 * * *"; fi
          if [ "$SCHEDULE" != "$three" ]; then echo "Not 3:30 AM Eastern today, skipping"; exit 0; fi
          since=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&status=success&created=%3E%3D$since" --jq .total_count) || recent=0
          if [ "$recent" != "0" ]; then echo "Already built since $since, skipping"; exit 0; fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  build:
    needs: when
    # Refresh taps, pushes and hand runs skip "when" and always build.
    if: ${{ !cancelled() && (needs.when.result == 'skipped' || needs.when.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # to save new battles to the battle-data branch
    steps:
      - uses: actions/checkout@v5

      # Battle history lives on its own battle-data branch (only data/ is on it), because
      # main only takes changes through pull requests. Start from the newest saved copy;
      # until that branch exists, the data/ in main is the starting point.
      - name: Load saved battles
        run: |
          if git fetch --depth=1 origin battle-data; then
            git checkout FETCH_HEAD -- data
            echo "Using battles saved on battle-data"
          else
            echo "No battle-data branch yet, starting from main's data/"
          fi

      # Calls go through the RoyaleAPI proxy, so the key's allowed IP (45.79.218.79) works from
      # GitHub's machines too. The key is the CR_API_TOKEN repo secret and never leaves the run.
      - name: Pull new battles and build pages
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
        run: python3 build_site.py

      # If saving fails, still publish the pages; the next run fetches the same battles again
      # (the API keeps the last 25), so nothing is lost unless saving keeps failing.
      - name: Save new battles
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          bd="$RUNNER_TEMP/battle-data"
          git worktree add --detach "$bd"
          cd "$bd"
          if git fetch --depth=1 origin battle-data; then
            git checkout -q FETCH_HEAD
          else
            git checkout -q --orphan battle-data
            git rm -rqf .
          fi
          rm -rf data
          cp -R "$GITHUB_WORKSPACE/data" data
          git add -A data
          if git diff --cached --quiet; then echo "No new battles"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Save new battles"
          git push origin HEAD:refs/heads/battle-data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Spelled out because a skipped "when" job would otherwise skip this one too.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
